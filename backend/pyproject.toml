[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-adi-agentic"
version = "0.3.0"
description = "Dynamic ontology-guided scientific triple research harness"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "python-multipart>=0.0.20,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pydantic-ai>=2.18,<3",
  "pydantic-ai-harness[codemode,dynamic-workflow]>=0.14,<0.15",
  "openai>=3.3,<4",
  "rdflib>=7.1,<8",
  "pyshacl>=0.30,<1",
  "owlrl>=7.1,<8",
  "pymupdf>=1.26,<2",
  "httpx>=0.28,<1",
  "aiosqlite>=0.21,<1",
  "tenacity>=9.1,<10",
  "orjson>=3.10,<4",
  "rapidfuzz>=3.13,<4",
  "opentelemetry-api>=1.36,<2",
  "opentelemetry-sdk>=1.36,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.36,<2",
  "langtrace-python-sdk>=3.7,<4",
  # Langtrace 3.8.x still imports pkg_resources during instrumentation.
  # Setuptools 82 removed that compatibility module.
  "setuptools>=75,<82",
  "importlib-metadata>=9.0.0",
  "ontogpt>=1.1.1",
]

[project.optional-dependencies]
durable-dbos = ["pydantic-ai[dbos]"]
durable-prefect = ["pydantic-ai[prefect]"]
durable-temporal = ["pydantic-ai[temporal]"]
eval = ["deepeval>=4.1", "pydantic-evals>=1.0"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.12", "mypy>=1.17"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
