services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    command: ["--config", "/app/config.yaml", "--host", "${LITELLM_HOST:-0.0.0.0}", "--port", "${LITELLM_PORT:-4000}"]
    volumes:
      - ./litellm_config.example.yaml:/app/config.yaml:ro
    env_file: .env
    ports: ["${LITELLM_PORT:-4000}:4000"]
  backend:
    build: ./backend
    env_file: .env
    volumes: ["./data:/app/data"]
    ports: ["8000:8000"]
    depends_on: [litellm]
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
      BACKEND_INTERNAL_URL: http://backend:8000
    ports: ["3000:3000"]
    depends_on: [backend]
